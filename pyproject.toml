[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claudechic"
dynamic = ["version"]
description = "Claude Chic - A stylish terminal UI for Claude Code"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.13.5",
    "anthropic>=0.89.0",
    "claude-agent-sdk>=0.1.56",  # 0.1.55+ has get_context_usage() for context window info
    "psutil>=7.2.2",
    "pyperclip>=1.11.0",
    "pyyaml>=6.0",
    "textual>=8.2.3",
    "textual-autocomplete>=4.0.6",
]
authors = [{ name = "Matthew Rocklin", email = "mrocklin@gmail.com" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/mrocklin/claudechic"
Repository = "https://github.com/mrocklin/claudechic"

[project.scripts]
claudechic = "claudechic.__main__:main"

[dependency-groups]
dashboard = [
    "altair>=6.0.0",
    "marimo>=0.19.6",
]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.1",
    "pre-commit>=4.0.0",
    "pyright>=1.1.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-timeout>=2.3.1",
    "pytest-xdist>=3.8.0",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["claudechic*"]

[tool.setuptools.package-data]
claudechic = ["*.tcss", "*.md", "prompts/*.md"]

[tool.pyright]
exclude = ["build", ".venv", "dist", "site", "**/__pycache__"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: integration tests requiring X11 binaries (Xvfb, xpra, etc.)",
]
# Integration tests excluded by default. Override with:
#   pytest -m integration tests/integration/   # run integration only
#   pytest -m ''  tests/                        # run ALL tests (unit + integration)
# Note: command-line -m replaces addopts -m (pytest >=7). Combined markers
# (e.g., -m 'slow and integration') also work because CLI wins over addopts.
addopts = "-m 'not integration'"

[tool.setuptools_scm]
